<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Holding — Submit Lead</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .form-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }
    .form-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .form-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
    }
    .lang-select {
      padding: 6px 10px;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      cursor: pointer;
      outline: none;
      color: #444;
      flex-shrink: 0;
    }
    .lang-select:focus { border-color: #2563eb; }
    .form-subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
    }
    .section-header {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
      padding-bottom: 8px;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 20px;
      margin-top: 32px;
    }
    .section-header:first-of-type { margin-top: 0; }
    .contact-note {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
      margin-top: -12px;
    }
    .field-row { margin-bottom: 16px; }
    .field-row-inline {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }
    .field-row-inline .field-group { flex: 1; }
    .field-group { position: relative; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #444;
      margin-bottom: 4px;
    }
    label .required { color: #e53935; }
    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus { border-color: #2563eb; }
    input.is-error { border-color: #e53935; }
    input.is-success { border-color: #2e7d32; }
    .phone-group {
      display: flex;
      gap: 8px;
    }
    .phone-group .country-code {
      width: 120px;
      flex-shrink: 0;
      padding: 10px 8px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      outline: none;
      cursor: pointer;
    }
    .phone-group .country-code:focus { border-color: #2563eb; }
    .phone-group input[type="tel"] {
      flex: 1;
      min-width: 0;
    }
    .field-message {
      font-size: 12px;
      margin-top: 4px;
      min-height: 16px;
    }
    .field-message.error { color: #e53935; }
    .field-message.warning { color: #e67e22; }
    .field-message.success { color: #2e7d32; }
    .field-message.checking { color: #666; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .checkbox-row label { margin-bottom: 0; cursor: pointer; }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 24px;
    }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    .result-box {
      display: none;
      padding: 16px;
      border-radius: 8px;
      margin-top: 24px;
      font-size: 14px;
    }
    .result-box.show { display: block; }
    .result-box.success {
      background: #e8f5e9;
      border: 1px solid #66bb6a;
      color: #2e7d32;
    }
    .result-box.error {
      background: #fce4ec;
      border: 1px solid #ef5350;
      color: #c62828;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ccc;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .saved-indicator {
      font-size: 12px;
      color: #2563eb;
      margin-bottom: 16px;
      display: none;
    }
    .saved-indicator.show { display: block; }
    @media (max-width: 500px) {
      .form-container { padding: 24px 20px; }
      .field-row-inline { flex-direction: column; gap: 16px; }
      .phone-group .country-code { width: 100px; }
    }
  </style>
</head>

<div class="form-container">
  <div class="form-header">
    <h1 class="form-title" data-i18n="form_title">Submit a Lead</h1>
    <select class="lang-select" id="langSelect">
      <option value="en">English</option>
      <option value="ka">Georgian</option>
      <option value="ru">Russian</option>

  </div>

  <form id="leadForm" novalidate>

    <div class="section-header" data-i18n="section_lead">Lead Information</div>
    <div class="contact-note" data-i18n="contact_note">* At least one contact method required (phone number or email)</div>

    <div class="field-row-inline">
      <div class="field-group">
        <label for="first_name"><span data-i18n="lbl_first_name">First Name</span> <span class="required">*</span></label>
        <input type="text" id="first_name" name="first_name" required>
      </div>
      <div class="field-group">
        <label for="last_name"><span data-i18n="lbl_last_name">Last Name</span></label>
        <input type="text" id="last_name" name="last_name">
      </div>
    </div>

    <div class="field-row">
      <label for="phone1"><span data-i18n="lbl_phone1">Phone Number 1</span></label>
      <div class="phone-group">
        <select class="country-code" id="phone1_code"></select>
        <input type="tel" id="phone1" name="phone1" data-i18n-placeholder="phone_placeholder" placeholder="5XX XXX XXX">
      </div>
      <div class="field-message" id="phone1Msg"></div>
    </div>

    <div class="field-row">
      <label for="phone2"><span data-i18n="lbl_phone2">Phone Number 2</span></label>
      <div class="phone-group">
        <select class="country-code" id="phone2_code"></select>
        <input type="tel" id="phone2" name="phone2" data-i18n-placeholder="phone_placeholder" placeholder="5XX XXX XXX">
      </div>
      <div class="field-message" id="phone2Msg"></div>
    </div>

    <div class="field-row">
      <label for="lead_email"><span data-i18n="lbl_email">Email</span></label>
      <input type="email" id="lead_email" name="email">
    </div>

    <div class="section-header" data-i18n="section_broker">Your Broker Information</div>

    <div class="saved-indicator" id="savedIndicator" data-i18n="auto_filled">Auto-filled from your previous submission</div>

    <div class="field-row-inline">
      <div class="field-group">
        <label for="broker_first_name"><span data-i18n="lbl_broker_fn">First Name</span> <span class="required">*</span></label>
        <input type="text" id="broker_first_name" name="broker_first_name" required>
      </div>
      <div class="field-group">
        <label for="broker_last_name"><span data-i18n="lbl_broker_ln">Last Name</span> <span class="required">*</span></label>
        <input type="text" id="broker_last_name" name="broker_last_name" required>
      </div>
    </div>

    <div class="field-row">
      <label for="broker_phone"><span data-i18n="lbl_broker_phone">Phone</span> <span class="required">*</span></label>
      <div class="phone-group">
        <select class="country-code" id="broker_phone_code"></select>
        <input type="tel" id="broker_phone" name="broker_phone" required>
      </div>
    </div>

    <div class="field-row">
      <label for="broker_email"><span data-i18n="lbl_broker_email">Email</span></label>
      <input type="email" id="broker_email" name="broker_email">
    </div>

    <div class="field-row">
      <label for="agency_name"><span data-i18n="lbl_agency">Agency Name</span></label>
      <input type="text" id="agency_name" name="agency_name">
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="vat_payer" name="vat_payer">
      <label for="vat_payer" data-i18n="lbl_vat">VAT Payer</label>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn" data-i18n="btn_submit">Submit Lead</button>
  </form>

  <div class="result-box" id="resultBox"></div>

      if (T[lang][key]) el.textContent = T[lang][key];

    var state = phoneState[key];
    if (!state.status) return;

    if (state.status === 'duplicate' || state.status === 'warning') {
      var reason = state.reason || 'vr_lead';
      msgEl.textContent = t('reason_' + reason);
      msgEl.className = 'field-message ' + (state.status === 'warning' ? 'warning' : 'error');

      msgEl.textContent = t('available');
      msgEl.className = 'field-message success';

    { code: '81', label: '+81 JP' },
    { code: '82', label: '+82 KR' },
    { code: '66', label: '+66 TH' },
    { code: '84', label: '+84 VN' },
    { code: '60', label: '+60 MY' },
    { code: '62', label: '+62 ID' },
    { code: '63', label: '+63 PH' },
    { code: '65', label: '+65 SG' },
    { code: '61', label: '+61 AU' },
    { code: '64', label: '+64 NZ' },
    { code: '55', label: '+55 BR' },
    { code: '52', label: '+52 MX' },
    { code: '54', label: '+54 AR' },
    { code: '57', label: '+57 CO' },
    { code: '56', label: '+56 CL' },
    { code: '51', label: '+51 PE' },
    { code: '20', label: '+20 EG' },
    { code: '27', label: '+27 ZA' },
    { code: '234', label: '+234 NG' },
    { code: '254', label: '+254 KE' },
    { code: '212', label: '+212 MA' },
    { code: '216', label: '+216 TN' },
    { code: '213', label: '+213 DZ' }
  ];

  function populateCountryCode(selectId, defaultCode) {
    var sel = document.getElementById(selectId);
    countryCodes.forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c.code;
      opt.textContent = c.label;
      if (c.code === defaultCode) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  populateCountryCode('phone1_code', '995');
  populateCountryCode('phone2_code', '995');
  populateCountryCode('broker_phone_code', '995');

  // ===== DOM =====
  var form = document.getElementById('leadForm');
  var submitBtn = document.getElementById('submitBtn');
  var resultBox = document.getElementById('resultBox');
  var savedIndicator = document.getElementById('savedIndicator');
  var phone1Input = document.getElementById('phone1');
  var phone2Input = document.getElementById('phone2');
  var phone1Msg = document.getElementById('phone1Msg');
  var phone2Msg = document.getElementById('phone2Msg');

  // Phone clear state: true = OK to submit (either empty or check passed)
  var phone1Clear = true;
  var phone2Clear = true;
  var checkTimers = {};

  // ===== RESTORE BROKER INFO FROM LOCALSTORAGE =====
  var brokerFields = ['broker_first_name', 'broker_last_name', 'broker_phone', 'broker_phone_code', 'broker_email', 'agency_name', 'vat_payer'];
  var hasSaved = false;

  brokerFields.forEach(function (field) {
    var saved = localStorage.getItem('vr_broker_' + field);
    if (saved !== null && saved !== '') {
      var el = document.getElementById(field);
      if (el) {
        if (el.type === 'checkbox') {
          el.checked = saved === 'true';
        } else {
          el.value = saved;
        }
        hasSaved = true;
      }
    }
  });
  if (hasSaved) savedIndicator.classList.add('show');

  // ===== LANGUAGE INIT =====
  var savedLang = localStorage.getItem('vr_language') || 'en';
  setLanguage(savedLang);

  document.getElementById('langSelect').addEventListener('change', function () {
    setLanguage(this.value);
  });

  // ===== CLEAN PHONE — digits only =====
  function cleanPhone(val) {
    return val.replace(/\D/g, '');
  }

  // ===== LIVE VALIDATION — update button as user types =====
  ['first_name', 'phone1', 'phone2', 'lead_email', 'broker_first_name', 'broker_last_name', 'broker_phone'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', updateSubmitState);
  });
  updateSubmitState();

  // ===== DEBOUNCED DUPLICATE CHECK =====
  function checkPhone(input, codeSelectId, msgEl, isPhone1) {
    var key = isPhone1 ? 'p1' : 'p2';
    clearTimeout(checkTimers[key]);

    var local = cleanPhone(input.value);
    if (!local || local.length < 5) {
      msgEl.textContent = '';
      msgEl.className = 'field-message';
      input.classList.remove('is-error', 'is-success');
      phoneState[key] = { status: null, reason: null };
      if (isPhone1) phone1Clear = true; else phone2Clear = true;
      updateSubmitState();
      return;
    }

    checkTimers[key] = setTimeout(function () {
      phoneState[key] = { status: 'checking', reason: null };
      updateOnePhoneMsg(key, input, msgEl);
      input.classList.remove('is-error', 'is-success');

      var phoneVal = document.getElementById(codeSelectId).value + '|' + local;

      var args = {
        action: 'check_phone',
        phone1: isPhone1 ? phoneVal : '',
        phone2: isPhone1 ? '' : phoneVal,
        first_name: '', last_name: '', email: '',
        broker_first_name: '', broker_last_name: '',
        broker_phone: '', broker_email: '',
        agency_name: '', vat_payer: '',
        lang: currentLang
      };

      callAPI(args, function (data) {
        if (data.status === 'duplicate') {
          phoneState[key] = { status: 'duplicate', reason: data.reason || 'vr_lead' };
          updateOnePhoneMsg(key, input, msgEl);
          input.classList.add('is-error');
          input.classList.remove('is-success');
          if (isPhone1) phone1Clear = false; else phone2Clear = false;
        } else if (data.status === 'warning') {
          phoneState[key] = { status: 'warning', reason: data.reason || 'other_broker' };
          updateOnePhoneMsg(key, input, msgEl);
          input.classList.remove('is-error', 'is-success');
          if (isPhone1) phone1Clear = true; else phone2Clear = true;
        } else {
          phoneState[key] = { status: 'clear', reason: 'available' };
          updateOnePhoneMsg(key, input, msgEl);
          input.classList.add('is-success');
          input.classList.remove('is-error');
          if (isPhone1) phone1Clear = true; else phone2Clear = true;
        }
        updateSubmitState();
      }, function () {
        phoneState[key] = { status: 'check_failed', reason: null };
        updateOnePhoneMsg(key, input, msgEl);
        if (isPhone1) phone1Clear = false; else phone2Clear = false;
        updateSubmitState();
      });
    }, 500);
  }

  phone1Input.addEventListener('blur', function () {
    if (phone1Input.value.trim()) {
      checkPhone(phone1Input, 'phone1_code', phone1Msg, true);
    } else {
      phone1Msg.textContent = '';
      phone1Msg.className = 'field-message';
      phone1Input.classList.remove('is-error', 'is-success');
      phoneState.p1 = { status: null, reason: null };
      phone1Clear = true;
      updateSubmitState();
    }
  });
  phone2Input.addEventListener('blur', function () {
    if (phone2Input.value.trim()) {
      checkPhone(phone2Input, 'phone2_code', phone2Msg, false);
    } else {
      phone2Msg.textContent = '';
      phone2Msg.className = 'field-message';
      phone2Input.classList.remove('is-error', 'is-success');
      phoneState.p2 = { status: null, reason: null };
      phone2Clear = true;
      updateSubmitState();
    }
  });

  // Re-check when country code changes
  document.getElementById('phone1_code').addEventListener('change', function () {
    if (phone1Input.value.trim()) checkPhone(phone1Input, 'phone1_code', phone1Msg, true);
  });
  document.getElementById('phone2_code').addEventListener('change', function () {
    if (phone2Input.value.trim()) checkPhone(phone2Input, 'phone2_code', phone2Msg, false);
  });

  // ===== SUBMIT STATE =====
  function updateSubmitState() {
    var hasContact = cleanPhone(phone1Input.value).length >= 5
      || cleanPhone(phone2Input.value).length >= 5
      || document.getElementById('lead_email').value.trim() !== '';
    var hasFirstName = document.getElementById('first_name').value.trim() !== '';
    var hasBrokerRequired = document.getElementById('broker_first_name').value.trim() !== ''
      && document.getElementById('broker_last_name').value.trim() !== ''
      && cleanPhone(document.getElementById('broker_phone').value).length > 0;

    submitBtn.disabled = !phone1Clear || !phone2Clear || !hasContact || !hasFirstName || !hasBrokerRequired;
  }

  // ===== FORM SUBMIT =====
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    resultBox.className = 'result-box';

    var firstName = document.getElementById('first_name').value.trim();
    var lastName = document.getElementById('last_name').value.trim();
    var p1Local = cleanPhone(phone1Input.value);
    var p2Local = cleanPhone(phone2Input.value);
    var p1Code = document.getElementById('phone1_code').value;
    var p2Code = document.getElementById('phone2_code').value;
    var leadEmail = document.getElementById('lead_email').value.trim();
    var bFirst = document.getElementById('broker_first_name').value.trim();
    var bLast = document.getElementById('broker_last_name').value.trim();
    var bPhoneLocal = cleanPhone(document.getElementById('broker_phone').value);
    var bPhoneCode = document.getElementById('broker_phone_code').value;
    var bEmail = document.getElementById('broker_email').value.trim();
    var agencyName = document.getElementById('agency_name').value.trim();
    var vatPayer = document.getElementById('vat_payer').checked;

    // First name required
    if (!firstName) {
      showResult('error', t('val_first_name'));
      return;
    }
    // Conditional: at least phone or email required
    if (!p1Local && !p2Local && !leadEmail) {
      showResult('error', t('val_contact'));
      return;
    }
    if (!lastName) lastName = '-';
    if (!bFirst || !bLast || !bPhoneLocal) {
      showResult('error', t('val_broker'));
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = t('btn_submitting');

    var args = {
      action: 'submit_lead',
      first_name: firstName,
      last_name: lastName,
      phone1: p1Local ? (p1Code + '|' + p1Local) : '',
      phone2: p2Local ? (p2Code + '|' + p2Local) : '',
      email: leadEmail,
      broker_first_name: bFirst,
      broker_last_name: bLast,
      broker_phone: bPhoneCode + '|' + bPhoneLocal,
      broker_email: bEmail,
      agency_name: agencyName,
      vat_payer: vatPayer ? 'true' : 'false',
      lang: currentLang
    };

    callAPI(args, function (data) {
      if (data.status === 'created') {
        var reason = data.reason || (data.lead_id ? 'lead_created' : 'note_created');
        if (reason === 'note_created') {
          showResult('success', t('result_note_created'));
        } else {
          showResult('success', t('result_lead_created'));
        }
        saveBrokerInfo();
        // Reset lead fields only
        document.getElementById('first_name').value = '';
        document.getElementById('last_name').value = '';
        phone1Input.value = '';
        phone2Input.value = '';
        document.getElementById('lead_email').value = '';
        phone1Msg.textContent = '';
        phone2Msg.textContent = '';
        phone1Input.className = '';
        phone2Input.className = '';
        phoneState.p1 = { status: null, reason: null };
        phoneState.p2 = { status: null, reason: null };
        phone1Clear = true;
        phone2Clear = true;
      } else if (data.status === 'duplicate') {
        var reason = data.reason || 'vr_lead';
        if (reason === 'active_client') {
          showResult('error', t('reason_active_client'));
        } else {
          showResult('error', t('result_duplicate'));
        }
      } else {
        showResult('error', t('result_error'));
      }
      submitBtn.disabled = false;
      submitBtn.textContent = t('btn_submit');
    }, function () {
      showResult('error', t('result_error'));
      submitBtn.disabled = false;
      submitBtn.textContent = t('btn_submit');
    });
  });

  // ===== SAVE BROKER INFO =====
  function saveBrokerInfo() {
    brokerFields.forEach(function (field) {
      var el = document.getElementById(field);
      if (el) {
        var val = el.type === 'checkbox' ? String(el.checked) : el.value;
        localStorage.setItem('vr_broker_' + field, val);
      }
    });
  }

  // ===== SHOW RESULT =====
  function showResult(type, message) {
    resultBox.textContent = message;
    resultBox.className = 'result-box show ' + type;
  }

  // ===== API CALL =====
  function callAPI(args, onSuccess, onError) {
    var url = API_BASE + '?arguments=' + encodeURIComponent(JSON.stringify(args));

    fetch(url)
      .then(function (res) { return res.json(); })
      .then(function (response) {
        var data;
        try {
          if (response.details && response.details.output) {
            data = JSON.parse(response.details.output);
          } else {
            data = response;
          }
        } catch (e) {
          data = response;
        }
        onSuccess(data);
      })
      .catch(function (err) {
        console.error('API Error:', err);
        onError();
      });
  }

})();
</script>
