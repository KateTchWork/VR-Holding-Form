<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Holding — Submit Lead</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .form-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }
    .form-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    .form-subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
    }
    .section-header {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
      padding-bottom: 8px;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 20px;
      margin-top: 32px;
    }
    .section-header:first-of-type { margin-top: 0; }
    .field-row { margin-bottom: 16px; }
    .field-row-inline {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }
    .field-row-inline .field-group { flex: 1; }
    .field-group { position: relative; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #444;
      margin-bottom: 4px;
    }
    label .required { color: #e53935; }
    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus { border-color: #2563eb; }
    input.is-error { border-color: #e53935; }
    input.is-success { border-color: #2e7d32; }
    .phone-group {
      display: flex;
      gap: 8px;
    }
    .phone-group .country-code {
      width: 120px;
      flex-shrink: 0;
      padding: 10px 8px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      outline: none;
      cursor: pointer;
    }
    .phone-group .country-code:focus { border-color: #2563eb; }
    .phone-group input[type="tel"] {
      flex: 1;
      min-width: 0;
    }
    .field-message {
      font-size: 12px;
      margin-top: 4px;
      min-height: 16px;
    }
    .field-message.error { color: #e53935; }
    .field-message.success { color: #2e7d32; }
    .field-message.checking { color: #666; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .checkbox-row label { margin-bottom: 0; cursor: pointer; }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 24px;
    }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    .result-box {
      display: none;
      padding: 16px;
      border-radius: 8px;
      margin-top: 24px;
      font-size: 14px;
    }
    .result-box.show { display: block; }
    .result-box.success {
      background: #e8f5e9;
      border: 1px solid #66bb6a;
      color: #2e7d32;
    }
    .result-box.error {
      background: #fce4ec;
      border: 1px solid #ef5350;
      color: #c62828;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ccc;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .saved-indicator {
      font-size: 12px;
      color: #2563eb;
      margin-bottom: 16px;
      display: none;
    }
    .saved-indicator.show { display: block; }
    @media (max-width: 500px) {
      .form-container { padding: 24px 20px; }
      .field-row-inline { flex-direction: column; gap: 16px; }
      .phone-group .country-code { width: 100px; }
    }
  </style>
</head>
<body>

<div class="form-container">
  <h1 class="form-title">Submit a Lead</h1>
  <p class="form-subtitle">Fill in the lead details and your broker information below.</p>

  <form id="leadForm" novalidate>

    <div class="section-header">Lead Information</div>

    <div class="field-row-inline">
      <div class="field-group">
        <label for="first_name">First Name <span class="required">*</span></label>
        <input type="text" id="first_name" name="first_name" required>
      </div>
      <div class="field-group">
        <label for="last_name">Last Name <span class="required">*</span></label>
        <input type="text" id="last_name" name="last_name" required>
      </div>
    </div>

    <div class="field-row">
      <label for="phone1">Phone Number 1 <span class="required">*</span></label>
      <div class="phone-group">
        <select class="country-code" id="phone1_code"></select>
        <input type="tel" id="phone1" name="phone1" placeholder="5XX XXX XXX" required>
      </div>
      <div class="field-message" id="phone1Msg"></div>
    </div>

    <div class="field-row">
      <label for="phone2">Phone Number 2</label>
      <div class="phone-group">
        <select class="country-code" id="phone2_code"></select>
        <input type="tel" id="phone2" name="phone2" placeholder="5XX XXX XXX">
      </div>
      <div class="field-message" id="phone2Msg"></div>
    </div>

    <div class="field-row">
      <label for="lead_email">Email</label>
      <input type="email" id="lead_email" name="email">
    </div>

    <div class="section-header">Your Broker Information</div>

    <div class="saved-indicator" id="savedIndicator">Auto-filled from your previous submission</div>

    <div class="field-row-inline">
      <div class="field-group">
        <label for="broker_first_name">First Name <span class="required">*</span></label>
        <input type="text" id="broker_first_name" name="broker_first_name" required>
      </div>
      <div class="field-group">
        <label for="broker_last_name">Last Name <span class="required">*</span></label>
        <input type="text" id="broker_last_name" name="broker_last_name" required>
      </div>
    </div>

    <div class="field-row">
      <label for="broker_phone">Phone <span class="required">*</span></label>
      <div class="phone-group">
        <select class="country-code" id="broker_phone_code"></select>
        <input type="tel" id="broker_phone" name="broker_phone" required>
      </div>
    </div>

    <div class="field-row">
      <label for="broker_email">Email <span class="required">*</span></label>
      <input type="email" id="broker_email" name="broker_email" required>
    </div>

    <div class="field-row">
      <label for="agency_name">Agency Name</label>
      <input type="text" id="agency_name" name="agency_name">
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="vat_payer" name="vat_payer">
      <label for="vat_payer">VAT Payer</label>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Submit Lead</button>
  </form>

  <div class="result-box" id="resultBox"></div>
</div>

<script>
(function () {
  // ===== CONFIG =====
  var API_BASE = 'https://vr-holding-proxy.kt-eea.workers.dev';

  // ===== COUNTRY CODES =====
  var countryCodes = [
    { code: '995', label: '+995 GE' },
    { code: '1', label: '+1 US/CA' },
    { code: '44', label: '+44 UK' },
    { code: '49', label: '+49 DE' },
    { code: '33', label: '+33 FR' },
    { code: '39', label: '+39 IT' },
    { code: '34', label: '+34 ES' },
    { code: '31', label: '+31 NL' },
    { code: '32', label: '+32 BE' },
    { code: '41', label: '+41 CH' },
    { code: '43', label: '+43 AT' },
    { code: '45', label: '+45 DK' },
    { code: '46', label: '+46 SE' },
    { code: '47', label: '+47 NO' },
    { code: '48', label: '+48 PL' },
    { code: '30', label: '+30 GR' },
    { code: '36', label: '+36 HU' },
    { code: '40', label: '+40 RO' },
    { code: '351', label: '+351 PT' },
    { code: '353', label: '+353 IE' },
    { code: '354', label: '+354 IS' },
    { code: '356', label: '+356 MT' },
    { code: '357', label: '+357 CY' },
    { code: '358', label: '+358 FI' },
    { code: '359', label: '+359 BG' },
    { code: '370', label: '+370 LT' },
    { code: '371', label: '+371 LV' },
    { code: '372', label: '+372 EE' },
    { code: '373', label: '+373 MD' },
    { code: '374', label: '+374 AM' },
    { code: '375', label: '+375 BY' },
    { code: '380', label: '+380 UA' },
    { code: '381', label: '+381 RS' },
    { code: '382', label: '+382 ME' },
    { code: '383', label: '+383 XK' },
    { code: '385', label: '+385 HR' },
    { code: '386', label: '+386 SI' },
    { code: '387', label: '+387 BA' },
    { code: '389', label: '+389 MK' },
    { code: '420', label: '+420 CZ' },
    { code: '421', label: '+421 SK' },
    { code: '7', label: '+7 RU/KZ' },
    { code: '90', label: '+90 TR' },
    { code: '91', label: '+91 IN' },
    { code: '92', label: '+92 PK' },
    { code: '93', label: '+93 AF' },
    { code: '994', label: '+994 AZ' },
    { code: '998', label: '+998 UZ' },
    { code: '971', label: '+971 AE' },
    { code: '972', label: '+972 IL' },
    { code: '966', label: '+966 SA' },
    { code: '974', label: '+974 QA' },
    { code: '973', label: '+973 BH' },
    { code: '968', label: '+968 OM' },
    { code: '965', label: '+965 KW' },
    { code: '962', label: '+962 JO' },
    { code: '961', label: '+961 LB' },
    { code: '964', label: '+964 IQ' },
    { code: '98', label: '+98 IR' },
    { code: '86', label: '+86 CN' },
    { code: '81', label: '+81 JP' },
    { code: '82', label: '+82 KR' },
    { code: '66', label: '+66 TH' },
    { code: '84', label: '+84 VN' },
    { code: '60', label: '+60 MY' },
    { code: '62', label: '+62 ID' },
    { code: '63', label: '+63 PH' },
    { code: '65', label: '+65 SG' },
    { code: '61', label: '+61 AU' },
    { code: '64', label: '+64 NZ' },
    { code: '55', label: '+55 BR' },
    { code: '52', label: '+52 MX' },
    { code: '54', label: '+54 AR' },
    { code: '57', label: '+57 CO' },
    { code: '56', label: '+56 CL' },
    { code: '51', label: '+51 PE' },
    { code: '20', label: '+20 EG' },
    { code: '27', label: '+27 ZA' },
    { code: '234', label: '+234 NG' },
    { code: '254', label: '+254 KE' },
    { code: '212', label: '+212 MA' },
    { code: '216', label: '+216 TN' },
    { code: '213', label: '+213 DZ' }
  ];

  function populateCountryCode(selectId, defaultCode) {
    var sel = document.getElementById(selectId);
    countryCodes.forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c.code;
      opt.textContent = c.label;
      if (c.code === defaultCode) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  // Lead phones: default to +995, broker phone: default to +995
  populateCountryCode('phone1_code', '995');
  populateCountryCode('phone2_code', '995');
  populateCountryCode('broker_phone_code', '995');

  // ===== DOM =====
  var form = document.getElementById('leadForm');
  var submitBtn = document.getElementById('submitBtn');
  var resultBox = document.getElementById('resultBox');
  var savedIndicator = document.getElementById('savedIndicator');
  var phone1Input = document.getElementById('phone1');
  var phone2Input = document.getElementById('phone2');
  var phone1Msg = document.getElementById('phone1Msg');
  var phone2Msg = document.getElementById('phone2Msg');

  var phone1Clear = false;
  var phone2Clear = true;
  var checkTimers = {};

  // ===== RESTORE BROKER INFO FROM LOCALSTORAGE =====
  var brokerFields = ['broker_first_name', 'broker_last_name', 'broker_phone', 'broker_phone_code', 'broker_email', 'agency_name', 'vat_payer'];
  var hasSaved = false;

  brokerFields.forEach(function (field) {
    var saved = localStorage.getItem('vr_broker_' + field);
    if (saved !== null && saved !== '') {
      var el = document.getElementById(field);
      if (el) {
        if (el.type === 'checkbox') {
          el.checked = saved === 'true';
        } else {
          el.value = saved;
        }
        hasSaved = true;
      }
    }
  });
  if (hasSaved) savedIndicator.classList.add('show');

  // ===== CLEAN PHONE — digits only =====
  function cleanPhone(val) {
    return val.replace(/\D/g, '');
  }

  // ===== BUILD FULL NUMBER: countryCode + localDigits =====
  function buildFullPhone(codeSelectId, inputEl) {
    var code = document.getElementById(codeSelectId).value;
    var local = cleanPhone(inputEl.value);
    if (!local) return '';
    return code + local;
  }

  // ===== DEBOUNCED DUPLICATE CHECK =====
  function checkPhone(input, codeSelectId, msgEl, isPhone1) {
    var key = isPhone1 ? 'p1' : 'p2';
    clearTimeout(checkTimers[key]);

    var local = cleanPhone(input.value);
    if (!local || local.length < 5) {
      msgEl.textContent = '';
      msgEl.className = 'field-message';
      input.classList.remove('is-error', 'is-success');
      if (isPhone1) phone1Clear = false; else phone2Clear = true;
      updateSubmitState();
      return;
    }

    checkTimers[key] = setTimeout(function () {
      msgEl.innerHTML = '<span class="spinner"></span> Checking...';
      msgEl.className = 'field-message checking';
      input.classList.remove('is-error', 'is-success');

      var fullPhone = buildFullPhone(codeSelectId, input);

      // Send full number (code+local) with pipe separator so function knows the local part
      var phoneVal = document.getElementById(codeSelectId).value + '|' + local;

      var args = {
        action: 'check_phone',
        phone1: isPhone1 ? phoneVal : '',
        phone2: isPhone1 ? '' : phoneVal,
        first_name: '', last_name: '', email: '',
        broker_first_name: '', broker_last_name: '',
        broker_phone: '', broker_email: '',
        agency_name: '', vat_payer: ''
      };

      callAPI(args, function (data) {
        if (data.status === 'duplicate') {
          msgEl.textContent = data.message;
          msgEl.className = 'field-message error';
          input.classList.add('is-error');
          input.classList.remove('is-success');
          if (isPhone1) phone1Clear = false; else phone2Clear = false;
        } else {
          msgEl.textContent = 'Available';
          msgEl.className = 'field-message success';
          input.classList.add('is-success');
          input.classList.remove('is-error');
          if (isPhone1) phone1Clear = true; else phone2Clear = true;
        }
        updateSubmitState();
      }, function () {
        msgEl.textContent = 'Could not verify — please try again';
        msgEl.className = 'field-message error';
        if (isPhone1) phone1Clear = false; else phone2Clear = false;
        updateSubmitState();
      });
    }, 500);
  }

  phone1Input.addEventListener('blur', function () { checkPhone(phone1Input, 'phone1_code', phone1Msg, true); });
  phone2Input.addEventListener('blur', function () {
    if (phone2Input.value.trim()) checkPhone(phone2Input, 'phone2_code', phone2Msg, false);
  });
  // Re-check when country code changes
  document.getElementById('phone1_code').addEventListener('change', function () {
    if (phone1Input.value.trim()) checkPhone(phone1Input, 'phone1_code', phone1Msg, true);
  });
  document.getElementById('phone2_code').addEventListener('change', function () {
    if (phone2Input.value.trim()) checkPhone(phone2Input, 'phone2_code', phone2Msg, false);
  });

  // ===== SUBMIT STATE =====
  function updateSubmitState() {
    submitBtn.disabled = !phone1Clear || !phone2Clear;
  }

  // ===== FORM SUBMIT =====
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    resultBox.className = 'result-box';

    var firstName = document.getElementById('first_name').value.trim();
    var lastName = document.getElementById('last_name').value.trim();
    var p1Local = cleanPhone(phone1Input.value);
    var p2Local = cleanPhone(phone2Input.value);
    var p1Code = document.getElementById('phone1_code').value;
    var p2Code = document.getElementById('phone2_code').value;
    var leadEmail = document.getElementById('lead_email').value.trim();
    var bFirst = document.getElementById('broker_first_name').value.trim();
    var bLast = document.getElementById('broker_last_name').value.trim();
    var bPhoneLocal = cleanPhone(document.getElementById('broker_phone').value);
    var bPhoneCode = document.getElementById('broker_phone_code').value;
    var bEmail = document.getElementById('broker_email').value.trim();
    var agencyName = document.getElementById('agency_name').value.trim();
    var vatPayer = document.getElementById('vat_payer').checked;

    if (!firstName || !lastName) { showResult('error', 'Please fill in First Name and Last Name.'); return; }
    if (!p1Local) { showResult('error', 'Phone Number 1 is required.'); return; }
    if (!bFirst || !bLast || !bPhoneLocal || !bEmail) { showResult('error', 'Please fill in all required broker fields.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    var args = {
      action: 'submit_lead',
      first_name: firstName,
      last_name: lastName,
      phone1: p1Code + '|' + p1Local,
      phone2: p2Local ? (p2Code + '|' + p2Local) : '',
      email: leadEmail,
      broker_first_name: bFirst,
      broker_last_name: bLast,
      broker_phone: bPhoneCode + '|' + bPhoneLocal,
      broker_email: bEmail,
      agency_name: agencyName,
      vat_payer: vatPayer ? 'true' : 'false'
    };

    callAPI(args, function (data) {
      if (data.status === 'created') {
        showResult('success', data.message);
        saveBrokerInfo();
        // Reset lead fields only
        document.getElementById('first_name').value = '';
        document.getElementById('last_name').value = '';
        phone1Input.value = '';
        phone2Input.value = '';
        document.getElementById('lead_email').value = '';
        phone1Msg.textContent = '';
        phone2Msg.textContent = '';
        phone1Input.className = '';
        phone2Input.className = '';
        phone1Clear = false;
        phone2Clear = true;
      } else {
        showResult('error', data.message);
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Lead';
    }, function () {
      showResult('error', 'Something went wrong. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Lead';
    });
  });

  // ===== SAVE BROKER INFO =====
  function saveBrokerInfo() {
    brokerFields.forEach(function (field) {
      var el = document.getElementById(field);
      if (el) {
        var val = el.type === 'checkbox' ? String(el.checked) : el.value;
        localStorage.setItem('vr_broker_' + field, val);
      }
    });
  }

  // ===== SHOW RESULT =====
  function showResult(type, message) {
    resultBox.textContent = message;
    resultBox.className = 'result-box show ' + type;
  }

  // ===== API CALL =====
  function callAPI(args, onSuccess, onError) {
    var url = API_BASE + '?arguments=' + encodeURIComponent(JSON.stringify(args));

    fetch(url)
      .then(function (res) { return res.json(); })
      .then(function (response) {
        var data;
        try {
          if (response.details && response.details.output) {
            data = JSON.parse(response.details.output);
          } else {
            data = response;
          }
        } catch (e) {
          data = response;
        }
        onSuccess(data);
      })
      .catch(function (err) {
        console.error('API Error:', err);
        onError();
      });
  }

})();
</script>

</body>
</html>
